<?xml version="1.0" encoding="UTF-8"?>
<svg id="better-albay" xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="0 0 250 250">
  <!-- BetterAlbay.org — Mayon Volcano mark -->
  <defs>
    <style>
      .bg { fill: #0032a0; }
      .sun { fill: #f2c91d; }
      .cone { fill: #f1f2f2; }
      .smoke { fill: #f1f2f2; opacity: 0.85; }
    </style>
  </defs>
  <rect class="bg" x="3.9" y="3.9" width="242.3" height="242.3" rx="72.8" ry="72.8"/>
  <!-- rising sun behind the perfect cone -->
  <circle class="sun" cx="125" cy="118" r="52"/>
  <!-- Mayon’s near-perfect cone with concave slopes -->
  <path class="cone" d="M125 74
    C 121 92, 108 128, 78 186
    L 62 214
    L 188 214
    L 172 186
    C 142 128, 129 92, 125 74 Z"/>
  <!-- foothill line -->
  <path d="M84 176 C 104 184, 146 184, 166 176" stroke="#0032a0" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.25"/>
  <!-- plume of smoke -->
  <ellipse class="smoke" cx="112" cy="66" rx="16" ry="9" transform="rotate(-18 112 66)"/>
  <ellipse class="smoke" cx="134" cy="52" rx="20" ry="11" transform="rotate(12 134 52)" opacity="0.7"/>
</svg>
